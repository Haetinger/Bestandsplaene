<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestandsplan-Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Zeichenbüro. Werkzeugleiste links, Plan in der Mitte, Eigenschaften rechts. Schrift nach Art der Verkehrsschrift. */
  --bg:#e9ecf0; --panel:#fbfcfd; --ink:#18212e; --mute:#5b6676; --line:#d3d9e1;
  --accent:#0a5796; --accent-ink:#ffffff; --hi:#f2b400; --stage:#cfd5dc; --danger:#b3261e;
  --display:"Barlow Condensed","Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
  --body:"Barlow","Bahnschrift","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#1a2029; --ink:#e7ebf1; --mute:#9aa6b7; --line:#2d3643;
    --accent:#63abea; --accent-ink:#0b1622; --hi:#f2b400; --stage:#0b0e12; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#1a2029; --ink:#e7ebf1; --mute:#9aa6b7; --line:#2d3643;
  --accent:#63abea; --accent-ink:#0b1622; --hi:#f2b400; --stage:#0b0e12; --danger:#ff8a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.35 var(--body);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-right:6px}
.brand i{display:block;width:26px;height:16px;background:
  linear-gradient(var(--ink),var(--ink)) 0 0/100% 2px no-repeat,
  linear-gradient(var(--ink),var(--ink)) 0 100%/100% 2px no-repeat,
  repeating-linear-gradient(90deg,var(--hi) 0 6px,transparent 6px 11px) 0 50%/100% 2px no-repeat}
.grp{display:flex;gap:4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 10px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn.warn:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:2px 7px;font-size:13px}
.spacer{flex:1}
#mapSel{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 6px;max-width:190px}
#q{width:230px;max-width:60vw;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 9px}
.attr{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#ffffffd9;color:#18212e;border-radius:4px;padding:3px 9px;font-size:11px;max-width:46%;text-align:center}
.attr a{color:inherit}
.attr:empty{display:none}
.hits{display:flex;flex-direction:column;gap:6px}
.hits .btn{text-align:left;white-space:normal}

main{display:grid;grid-template-columns:184px minmax(0,1fr) 312px;min-height:0}
.tools{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 0;display:flex;flex-direction:column;gap:1px}
.tools h2,.props h3{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0}
.tools h2{padding:6px 14px 6px}
.tool{display:flex;justify-content:space-between;align-items:center;gap:6px;border:0;border-left:4px solid transparent;background:transparent;text-align:left;padding:6px 12px 6px 10px}
.tool kbd{font:500 11px var(--body);color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tool:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tool[aria-pressed="true"]{border-left-color:var(--hi);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:600}
.layers{padding:2px 14px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.layers label{display:flex;gap:6px;align-items:center}

.stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hint>*{pointer-events:auto}
.hint .msg{background:#18212eee;color:#fff;border-radius:4px;padding:5px 10px;font-size:13px;max-width:100%}
.hint .btn{background:#fff;color:#18212e;border-color:#18212e}
.status{position:absolute;left:12px;bottom:10px;background:#ffffffd9;color:#18212e;border-radius:4px;padding:3px 9px;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:10px;display:flex;gap:4px}
.zoom .btn{background:#fff;color:#18212e;border-color:#aab3bf;min-width:32px}
.toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:#18212e;color:#fff;padding:8px 14px;border-radius:4px;font-size:13px;max-width:80%;display:none}

.props{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:9px}
.props h2{font:700 20px/1.1 var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.props h3{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.props p{margin:0;color:var(--mute);font-size:13px}
.f{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.f>span:first-child{color:var(--mute)}
.f input[type=text],.f input[type=number],.f select,.strip select,.strip input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-variant-numeric:tabular-nums}
.f input[type=range]{width:100%}
.chk{display:flex;gap:7px;align-items:center;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.xs{display:flex;flex-direction:column;gap:3px}
.strip{display:grid;grid-template-columns:14px minmax(0,1fr) 62px 24px;gap:5px;align-items:center;font-size:13px}
.strip .sw{width:14px;height:20px;border:1px solid var(--line);border-radius:2px}
.strip.ln{grid-template-columns:14px minmax(0,1fr);opacity:.95}
.strip.ln .sw{height:2px;border:0;background:var(--mute);align-self:center}
.strip.ln select{font-size:12px;padding:1px 4px;color:var(--mute)}
.strip button{border:0;background:transparent;color:var(--mute);padding:0}
.strip button:hover{color:var(--danger)}

dialog{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:18px 20px;max-width:min(880px,92vw);max-height:86vh;overflow:auto}
dialog::backdrop{background:#0008}
dialog h2{font:700 22px/1.1 var(--display);margin:0 0 10px}
dialog .row{margin-top:14px;justify-content:flex-end}
dialog .f{grid-template-columns:150px 1fr}
.tw{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
th,td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

@media (max-width:860px){
  body{overflow:auto;display:block}
  main{display:block}
  .tools{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 16px;align-items:center}
  .tools h2,.layers{display:none}
  .tool{border-left:0;border-bottom:4px solid transparent;white-space:nowrap}
  .tool kbd{display:none}
  .tool[aria-pressed="true"]{border-bottom-color:var(--hi)}
  .stage{height:62vh;min-height:380px}
  .props{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i></i>Bestandsplan</div>
  <form class="grp" id="fSearch" role="search">
    <input type="search" id="q" placeholder="Adresse oder Straße suchen" aria-label="Ort suchen">
    <button class="btn" type="submit">Suchen</button>
  </form>
  <div class="grp">
    <select id="mapSel" aria-label="Hintergrundkarte" title="Hintergrundkarte am Bildschirm"></select>
    <button class="btn pri" id="bBase" title="Kataster und Straßen für einen Ausschnitt automatisch übernehmen">Grundlage erzeugen</button>
  </div>
  <div class="grp">
    <button class="btn warn" id="bNew" title="Leeren Plan beginnen">Neu</button>
    <button class="btn" id="bOpen" title="Gespeicherte Projektdatei laden">Projekt öffnen</button>
    <button class="btn" id="bSave" title="Projektdatei mit Luftbild speichern">Projekt speichern</button>
  </div>
  <div class="grp">
    <button class="btn" id="bBg" title="Luftbild, Kartenausschnitt oder gescannten Plan als Zeichengrundlage laden">Eigenes Bild laden</button>
    <button class="btn" id="bCal" title="Zwei Punkte mit bekanntem Abstand anklicken">Maßstab kalibrieren</button>
  </div>
  <div class="grp">
    <button class="btn" id="bUndo" title="Rückgängig (Strg+Z)">Rückgängig</button>
    <button class="btn" id="bRedo" title="Wiederholen (Strg+Y)">Wiederholen</button>
  </div>
  <span class="spacer"></span>
  <div class="grp">
    <button class="btn" id="bList">Bestandsliste</button>
    <button class="btn pri" id="bPdf">PDF erzeugen</button>
  </div>
  <input type="file" id="inBg" accept="image/*" hidden>
  <input type="file" id="inProj" accept=".json,application/json" hidden>
</header>
<main>
  <nav class="tools" id="tools" aria-label="Werkzeuge"></nav>
  <section class="stage" id="stage">
    <canvas id="cv" tabindex="-1"></canvas>
    <div class="hint" id="hint"></div>
    <div class="status" id="status"></div>
    <div class="attr" id="attr"></div>
    <div class="zoom">
      <button class="btn" id="zOut" title="Verkleinern">−</button>
      <button class="btn" id="zFit" title="Alles zeigen">Alles</button>
      <button class="btn" id="zIn" title="Vergrößern">+</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>
  <aside class="props" id="props" aria-label="Eigenschaften"></aside>
</main>
<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  if((e.ctrlKey||e.metaKey)&&!inF){const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();undo(e.shiftKey?1:-1)}else if(k==='y'){e.preventDefault();undo(1)}return}
  if(inF)return;
  if(e.key===' '){space=true;e.preventDefault();return}
  if(e.key==='Enter'){finish();return}
  if(e.key==='Escape'){if(draft){draft=null;hint()}else if(tool!=='sel')setTool('sel');else{sel=null;selV=-1;renderProps()}draw();return}
  if(e.key==='Backspace'&&draft){draft.pts.pop();if(!draft.pts.length)draft=null;hint();draw();e.preventDefault();return}
  if(e.key==='Delete'||e.key==='Backspace'){del();e.preventDefault();return}
  const t=TOOLS.find(t=>t[2].toLowerCase()===e.key.toLowerCase());if(t)setTool(t[0]);
});
window.addEventListener('keyup',e=>{if(e.key===' ')space=false});

  commit();renderProps();draw()}

  const dl=await DLP;
  if(!dl){ if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();return true}
    toast('Speichern ist in dieser Ansicht nicht möglich. Öffne das Tool direkt in Claude.');return false}
  try{await dl.save({filename:name,data});toast('Gespeichert: '+name);return true}
  catch(e){if(e&&e.code==='declined')return false;toast('Speichern hat nicht geklappt ('+((e&&e.code)||'unbekannter Fehler')+'). Versuch es noch einmal.');return false}

/* ---------- Grundlage aus Kataster (ALKIS) und OpenStreetMap ---------- */
function utm32inv(E,N){
  const a=6378137,f=1/298.257222101,k0=.9996,e2=f*(2-f),ep=e2/(1-e2),e4=e2*e2,e6=e4*e2,x=E-500000,mu=N/k0/(a*(1-e2/4-3*e4/64-5*e6/256)),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const sn=Math.sin(p1),cs=Math.cos(p1),tn=Math.tan(p1),N1=a/Math.sqrt(1-e2*sn*sn),T=tn*tn,C=ep*cs*cs,R=a*(1-e2)/Math.pow(1-e2*sn*sn,1.5),D=x/(N1*k0);
  const lat=p1-(N1*tn/R)*(D*D/2-(5+3*T+10*C-4*C*C-9*ep)*D**4/24+(61+90*T+298*C+45*T*T-252*ep-3*C*C)*D**6/720);
  const lon=(D-(1+2*T+C)*D**3/6+(5-2*C+28*T-3*C*C+8*ep+24*T*T)*D**5/120)/cs;
  return[lat*180/Math.PI,9+lon*180/Math.PI];
}
async function wfs(type,b){

async function exportPdf(){
  if(!window.jspdf){toast('Die PDF-Bibliothek ist nicht geladen. Lade die Seite neu.');return}
  let sheets=S.objs.filter(o=>o.t==='sheet');
  if(!sheets.length){const c=s2w([CW/2,CH/2]),b=bbox()||[c[0],c[1],c[0],c[1]];S.objs.push({id:uid(),t:'sheet',p:[(b[0]+b[2])/2,(b[1]+b[3])/2],rot:0});S.layers.sheet=true;commit();renderTools();renderProps();draw();sheets=S.objs.filter(o=>o.t==='sheet');toast('Es gab noch kein Blatt. Ich habe eines in der Planmitte angelegt.')}
  const btn=$('#bPdf');btn.disabled=true;btn.textContent='PDF wird erzeugt …';await new Promise(r=>setTimeout(r,30));
  try{
    const f=frame(),or=f.PW>=f.PH?'l':'p',doc=new window.jspdf.jsPDF({orientation:or,unit:'mm',format:[f.PW,f.PH],compress:true});
    doc.setProperties({title:lat((S.meta.projekt||'Bestandsplan')+' - '+(S.meta.inhalt||'')),author:lat(S.meta.verfasser||''),creator:'Bestandsplan-Editor'});
    let miss=0;

      doc.saveGraphicsState();doc.rect(f.ax,f.ay,f.aw,f.ah,null);doc.clip();doc.discardPath();scene(pdfG(doc,sh,f));doc.restoreGraphicsState();
      const atts=[];if(img&&img.att)atts.push('Hintergrund: '+img.att);if(BASE.length&&S.layers.base)atts.push('Geobasisdaten (c) LGL Baden-Wuerttemberg ('+YR+'), dl-de/by-2-0, www.lgl-bw.de');
      if(S.objs.some(o=>o.src==='osm'))atts.push('Strassen nach (c) OpenStreetMap-Mitwirkende (ODbL)');
      if(atts.length){doc.setFont('helvetica','normal');doc.setFontSize(5.5);const t=lat(atts.join('  |  ')),w=doc.getTextWidth(t);doc.setFillColor('#ffffff');doc.rect(f.ax+f.aw-w-3,f.ay+f.ah-3.6,w+3,3.6,'F');doc.setTextColor('#333333');doc.text(t,f.ax+f.aw-w-1.5,f.ay+f.ah-1.1)}

  btn.disabled=false;btn.textContent='PDF erzeugen';
}
