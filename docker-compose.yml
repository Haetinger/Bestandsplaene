services:
  bestandsplan:
    image: nginx:1.27-alpine
    container_name: bestandsplan
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"   # nur lokal erreichbar; nach außen über den Cloudflare Tunnel
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-tiles.inc:/etc/nginx/conf.d/proxy-tiles.inc:ro
      - tiles:/var/cache/nginx/tiles

volumes:
  tiles:
