# Bestandsplan-Editor: statische Seite + Proxy für Kartendienste und Ortssuche.
# Der Proxy spricht nur die drei unten genannten Dienste an.

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=3g inactive=90d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=geo:1m rate=1r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Luftbild DOP20, LGL Baden-Württemberg (Datenlizenz Deutschland - Namensnennung - Version 2.0)
    location = /wms/dop {
        if ($arg_request !~* "^GetMap$") { return 403; }
        proxy_pass https://owsproxy.lgl-bw.de/owsproxy/ows/WMS_LGL-BW_ATKIS_DOP_20_C;
        proxy_set_header Host owsproxy.lgl-bw.de;
        include /etc/nginx/conf.d/proxy-tiles.inc;
    }

    # basemap.de Web Raster, BKG (CC BY 4.0)
    location = /wms/basemap {
        if ($arg_request !~* "^GetMap$") { return 403; }
        proxy_pass https://sgx.geodatenzentrum.de/wms_basemapde;
        proxy_set_header Host sgx.geodatenzentrum.de;
        include /etc/nginx/conf.d/proxy-tiles.inc;
    }

    # Ortssuche über Nominatim (OpenStreetMap). Nutzungsregeln: höchstens 1 Anfrage pro Sekunde,
    # keine Massenabfragen, keine Autovervollständigung. Siehe README.
    location = /geocode {
        limit_req zone=geo burst=2 nodelay;
        proxy_pass https://nominatim.openstreetmap.org/search;
        proxy_set_header Host nominatim.openstreetmap.org;
        proxy_set_header User-Agent "HX-mobility-Bestandsplan-Editor/1.0 (+https://bestandsplan.hxmobility.work)";
        proxy_set_header Referer "https://bestandsplan.hxmobility.work/";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_cache tiles;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }
}
